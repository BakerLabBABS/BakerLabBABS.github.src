- name: Matt Baker
  role: Associate Professor and Principal Investigator
  category: pi
  status: current
  image: Matt.jpg
  order: 1
  bio: |
    Matt leads the Baker Lab at the School of Biotechnology and Biomolecular Sciences ([BABS](https://www.babs.unsw.edu.au)) at UNSW. He completed an Hons in [Chemistry](https://chemistry.anu.edu.au/) at ANU and a DPhil in [Physics](https://www.physics.ox.ac.uk/) at the University of Oxford, studying the molecular motor that makes many bacteria swim. He started the group in 2018 as a [Scientia Fellow](https://research.unsw.edu.au/scientia-program) and was promoted to Associate Professor in 2023. See his [UNSW biography](https://www.babs.unsw.edu.au/matthew-baker) or [linktree](http://linktr.ee/phatmattbaker).
- name: Pietro Ridone
  role: Postdoctoral researcher
  category: postdoc
  status: current
  image: Pietro.jpg
  order: 2
  bio: Pietro applies genome editing and synthetic biology to study the stator proteins that power bacterial flagellar rotation, including engineering *E. coli* and designing artificial stators.
- name: Jacob Scadden
  role: Postdoctoral researcher
  category: postdoc
  status: current
  image: Jacob.jpg
  order: 3
  bio: Jacob joined the Baker lab in November 2022 after finishing his PhD at the Quadram Institute Bioscience, Norwich, UK (2018-2022) where he studied the regulation of antimicrobial peptides produced by human gut bacteria. Prior to that, Jacob studied both his undergraduate degree in biomedical science (2014-2017) and his Master’s in microbiology and infection (2017-2018) at the University of Birmingham, UK with projects focussing on antimicrobial efflux pumps. His current research project is focused on investigating the evolution of the bacterial flagellar filament using ancestral sequence reconstruction and engineering flagellin variants to test their effect on bacterial motility. Jacob is interested in understanding how these integral flagellar proteins have evolved and how they can be engineered for biotechnological purposes. Jacob is an active committee member of both the Australian Society of Microbiology (NSW/ACT Branch) and the Joint Academic Microbial Seminars Society, where he performs outreach and seminar hosting duties, respectively. Outside the lab, Jacob has taken up many Aussie hobbies including surfing, Oztag, touch rugby and flat white drinking as well as generally basking in the good weather after a lifetime in the UK.
