  bio: Oliver completed Honours in the Baker Lab in 2025, and began studying for a PhD in 2026. His current project focuses on designing RNA nanostructures to be transcribed inside of synthetic cells.
- name: Divyangi Pandit
  role: PhD student
  category: phd
  status: current
  image: Divyangi.jpg
  order: 10
  bio: Div completed her honours in the Baker Lab in 2023 where she worked on the characterisation of ancestral sequence reconstructions of the bacterial flagellar filament. She joined the lab as a PhD student in 2025 with a research focus on investigating the evolutionary relationships between the bacterial flagellar hook, hook-filament junction, and filament capping proteins. Div has a special interest in science communication and teaching and has been demonstrating for the School of BABS since 2024. Outside the lab you can find her at the cinemas, on a flight, curled up with a good book, or in pursuit of her next favourite hobby.
  alumni_note: Completed Honours in the Baker Lab in 2023.
