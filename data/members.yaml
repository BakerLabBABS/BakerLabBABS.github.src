- name: Matt Baker
  role: Associate Professor and Principal Investigator
  category: pi
  status: current
  image: Matt.jpg
  order: 1
  bio: |
    Matt leads the Baker Lab at the School of Biotechnology and Biomolecular Sciences ([BABS](https://www.babs.unsw.edu.au)) at UNSW. He completed an Hons in [Chemistry](https://chemistry.anu.edu.au/) at ANU and a DPhil in [Physics](https://www.physics.ox.ac.uk/) at the University of Oxford, studying the molecular motor that makes many bacteria swim. He started the group in 2018 as a [Scientia Fellow](https://research.unsw.edu.au/scientia-program) and was promoted to Associate Professor in 2023. He is generally passionate about microbial ecology, evolution, biophysics and synthetic biology. He is also Associate Dean International (Partnerships) in the Faculty of Science, where he is active in both global engagement and finding new friends in Universities worldwide. He has fenced internationally for many years but is winding it up. For more detail, see his [UNSW biography](https://www.babs.unsw.edu.au/matthew-baker) or [linktree](http://linktr.ee/phatmattbaker) for collection of links and interviews.
- name: Pietro Ridone
  role: Postdoctoral researcher
  category: postdoc
  status: current
  image: Pietro.jpg
  order: 2
  bio: Pietro applies genome editing and synthetic biology to study the stator proteins that power bacterial flagellar rotation, including engineering *E. coli* and designing artificial stators.
- name: Jacob Scadden
  role: Postdoctoral researcher
  category: postdoc
  status: current
  image: Jacob.jpg
  order: 3
  bio: Jacob joined the Baker lab in November 2022 after finishing his PhD at the Quadram Institute Bioscience, Norwich, UK (2018-2022) where he studied the regulation of antimicrobial peptides produced by human gut bacteria. Prior to that, Jacob studied both his undergraduate degree in biomedical science (2014-2017) and his Master’s in microbiology and infection (2017-2018) at the University of Birmingham, UK with projects focussing on antimicrobial efflux pumps. His current research project is focused on investigating the evolution of the bacterial flagellar filament using ancestral sequence reconstruction and engineering flagellin variants to test their effect on bacterial motility. Jacob is interested in understanding how these integral flagellar proteins have evolved and how they can be engineered for biotechnological purposes. Jacob is an active committee member of both the Australian Society of Microbiology (NSW/ACT Branch) and the Joint Academic Microbial Seminars Society, where he performs outreach and seminar hosting duties, respectively. Outside the lab, Jacob has taken up many Aussie hobbies including surfing, Oztag, touch rugby and flat white drinking as well as generally basking in the good weather after a lifetime in the UK.
- name: Janelle Ramos
  role: PhD student
  category: phd
  status: current
  image: Janelle.jpg
  order: 4
  bio: Janelle completed Honours in 2021 on ancestral reconstructions of the rotor and is researching urinary pathogenic *E. coli* to examine sequence-based diagnostics in catheter-associated infections.
- name: Jamiema Sara Philip
  role: PhD student
  category: phd
  status: current
  image: Jamiema.jpg
  order: 5
  bio: Jamiema’s research background includes bacterial diversity, antibiotic resistance, metagenomics and SARS-CoV-2 genome analysis.
- name: Yara Elahi
  role: PhD student
  category: phd
  status: current
  image: Yara.jpg
  order: 6
  bio: Yara is a PhD candidate in Microbiology who joined the Baker Lab in 2023. He conducted his master’s research at Tehran University of Medical Sciences, where he isolated bacteriophages from wastewater that were capable of lysing pathogenic bacteria isolated from patients’ blood. His PhD research focuses on developing an optogenetic approach to control bacterial motility using light. His research involves designing and optogenetically engineering bacterial flagellar motor and chemotaxis proteins to investigate how different engineered strains respond to light. During his PhD, he has actively served on the organising committees for the Australian Centre of Excellence in Synthetic Biology conference and the UNSW SBMS/BABS Joint Symposium.
- name: Fatemeh Mohaghegh
  role: PhD student
  category: phd
  status: current
  image: Fatemeh.jpg
  order: 7
  bio: Fatemeh joined the Baker Lab at UNSW Sydney in 2024 as a PhD candidate in Microbiology, investigating the molecular mechanisms linking bacterial motility and biofilm formation in *Escherichia coli*. She is particularly interested in how bacteria balance motility and biofilm formation and how these pathways can be manipulated for microbial control and biotechnology. Prior to UNSW, Fatemeh completed her Master’s in Medical Microbiology at the University of Isfahan, researching virulence and antimicrobial resistance in methicillin-resistant *Staphylococcus aureus*. She is actively involved in the Australian microbiology and synthetic biology communities as a member of the Australian Society for Microbiology (ASM) and the ARC Centre of Excellence in Synthetic Biology (CoESB). She has also taken on leadership and organisational roles, including Development and Partnerships Lead for ASM and committee roles for the 2026 CoESB Conference and Bugs by the Beach. Outside the lab, Fatemeh enjoys connecting with the scientific community and continuing to develop her skills in research, scientific communication and leadership.
- name: Sahiba Shah
  role: PhD student
  category: phd
  status: current
  image: Sahiba.jpg
  order: 8
  bio: Sahiba completed Honours in the Baker Lab in 2024 where she looked into the relationship between stator protein motility and biofilm formation in *E. coli* and *B. subtilis*. She began studying for a PhD in 2026 centered around *B. subtilis*’ biofilms and its role in agriculture.
- name: Oliver Taig
  role: PhD student
  category: phd
  status: current
  image: Oliver.jpg
  order: 9
  bio: Oliver completed Honours in the Baker Lab in 2025, and began studying for a PhD in 2026. His current project focuses on designing RNA nanostructures to be transcribed inside of synthetic cells.
- name: Divyangi Pandit
  role: PhD student
  category: phd
  status: current
  image: Divyangi.jpg
  order: 10
  bio: Div completed her honours in the Baker Lab in 2023 where she worked on the characterisation of ancestral sequence reconstructions of the bacterial flagellar filament. She joined the lab as a PhD student in 2025 with a research focus on investigating the evolutionary relationships between the bacterial flagellar hook, hook-filament junction, and filament capping proteins. Div has a special interest in science communication and teaching and has been demonstrating for the School of BABS since 2024. Outside the lab you can find her at the cinemas, on a flight, curled up with a good book, or in pursuit of her next favourite hobby.
  alumni_note: Completed Honours in the Baker Lab in 2023.
- name: Daniel Zhang
  role: PhD student
  category: phd
  status: current
  image: Daniel.jpg
  order: 11
  bio: Dan completed his undergrad at the University of Toronto, double majoring in molecular biology and evolutionary biology. He did his master’s at the University of Cambridge, where he researched microalgal synthetic biology. He then worked in the UK synthetic biology industry for 3 years before joining the Baker Lab in 2026. For his PhD, Dan is developing an intelligent microfluidic liposome production platform integrating machine learning and DNA nanotechnology.
